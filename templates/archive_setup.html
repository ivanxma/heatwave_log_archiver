{% extends 'base.html' %}
{% block content %}
<section>
  <h1>Set up archive database</h1>
  <p>Review or update the archive destination below. Credentials are fetched from OCI Vault when you confirm setup.</p>
  <form method="post" class="config" id="archive-setup-form">
    <p id="archive-unsaved" class="flash warning" role="status" hidden>You have unsaved changes. Confirm archive DB setup to save them.</p>
    <fieldset>
      <label>Archive host<input name="archive_host" value="{{ settings.get('archive_host', config.archive_host) }}"></label>
      <label>Port<input name="archive_port" value="{{ settings.get('archive_port', config.archive_port) }}"></label>
      <label>User<input name="archive_user" value="{{ settings.get('archive_user', config.archive_user) }}"></label>
      <label>Credential Secret OCID *<input name="archive_secret_ocid" value="{{ settings.get('archive_secret_ocid', config.archive_secret_ocid) }}" placeholder="ocid1.vaultsecret.…" required></label>
      <label>Socket (optional)<input name="archive_socket" value="{{ settings.get('archive_socket', config.archive_socket) }}"></label>
      <label>Database<input name="archive_db" value="{{ settings.get('archive_db', config.archive_db) }}"></label>
      <label>Table<input name="archive_table" value="{{ settings.get('archive_table', config.archive_table) }}"></label>
    </fieldset>
    <label class="checkbox-field"><input type="checkbox" name="confirm_setup" value="yes" required><span>Confirm schema and partition setup</span></label>
    <button>Confirm archive DB setup</button>
  </form>
</section>
<script>
(() => {
  const form = document.getElementById('archive-setup-form');
  const fields = [...form.querySelectorAll('fieldset input')];
  const saved = fields.map(input => input.value);
  const notice = document.getElementById('archive-unsaved');
  const update = () => { notice.hidden = !fields.some((input, index) => input.value !== saved[index]); };
  form.addEventListener('input', update);
  form.addEventListener('change', update);
})();
</script>
{% endblock %}
