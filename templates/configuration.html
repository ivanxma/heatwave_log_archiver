{% extends 'base.html' %}{% block content %}<h1>Job scheduling and configuration</h1><p>Passwords are retrieved at runtime from OCI Vault. Store Vault Secret OCIDs only.</p><form method="post" class="config"><fieldset><legend>Sources and policy</legend><label class="checkbox-field"><input type="checkbox" name="enabled" {{ 'checked' if settings.get('enabled', config.enabled) else '' }}><span>Enable archive job</span></label><label class="checkbox-field"><input type="checkbox" name="log_types" value="error_log" {{ 'checked' if 'error_log' in config.log_types else '' }}><span>Error log</span></label><label class="checkbox-field"><input type="checkbox" name="log_types" value="slow_log" {{ 'checked' if 'slow_log' in config.log_types else '' }}><span>Slow log</span></label><label class="checkbox-field"><input type="checkbox" name="log_types" value="general_log" {{ 'checked' if 'general_log' in config.log_types else '' }}><span>General log</span></label><label>Run every<input name="schedule" value="{{ settings.get('schedule', config.schedule) }}"></label><label>Retention months<input name="retention_months" value="{{ settings.get('retention_months', config.retention_months) }}"></label><label>Batch size<input name="batch_size" value="{{ settings.get('batch_size', config.batch_size) }}"></label></fieldset><fieldset><legend>Source MySQL</legend><label>Host<input name="source_host" value="{{ settings.get('source_host', config.source_host) }}"></label><label>Port<input name="source_port" value="{{ settings.get('source_port', config.source_port) }}"></label><label>User<input name="source_user" value="{{ settings.get('source_user', config.source_user) }}"></label><label>Vault Secret OCID<input name="source_secret_ocid" value="{{ settings.get('source_secret_ocid', config.source_secret_ocid) }}"></label><label>Socket (optional)<input name="source_socket" value="{{ settings.get('source_socket', config.source_socket) }}"></label></fieldset><fieldset><legend>Archive MySQL</legend><label>Host<input name="archive_host" value="{{ settings.get('archive_host', config.archive_host) }}"></label><label>Port<input name="archive_port" value="{{ settings.get('archive_port', config.archive_port) }}"></label><label>User<input name="archive_user" value="{{ settings.get('archive_user', config.archive_user) }}"></label><label>Vault Secret OCID<input name="archive_secret_ocid" value="{{ settings.get('archive_secret_ocid', config.archive_secret_ocid) }}"></label><label>Socket (optional)<input name="archive_socket" value="{{ settings.get('archive_socket', config.archive_socket) }}"></label><label>Database<input name="archive_db" value="{{ settings.get('archive_db', config.archive_db) }}"></label><label>Table<input name="archive_table" value="{{ settings.get('archive_table', config.archive_table) }}"></label></fieldset><button>Save configuration</button></form>{% endblock %}
