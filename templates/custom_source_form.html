{% extends 'base.html' %}{% block content %}<section><h1>{{ 'Edit' if index >= 0 else 'Add' }} optional table or view</h1><p>Add an audit table/view or another incremental source. It must expose a timestamp column used for archival ordering and partition placement.</p><form method="post" class="config"><fieldset><label>Display name *<input name="name" value="{{ source.name }}" required></label><label>Table or view *<small>schema.table or schema.view</small><input name="source" value="{{ source.source }}" required></label><label>Timestamp column *<input name="timestamp_column" value="{{ source.timestamp_column }}" required></label></fieldset><div class="form-actions"><button>Save optional source</button><a href="{{ url_for('configuration') }}">Cancel</a></div></form></section>{% endblock %}
