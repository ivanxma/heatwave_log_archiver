{% extends 'base.html' %}
{% block content %}
<section>
  <h1>{{ 'Edit' if index >= 0 else 'Add' }} {{ kind.replace('-', ' ')|title }}</h1>
  <form method="post" class="config">
    <fieldset>
      {% if kind in ('source-connections', 'archive-connections') %}
      <label>Name *<input name="name" value="{{ item.get('name', '') }}" required></label>
      <label>Host *<input name="host" value="{{ item.get('host', '') }}" required></label>
      <label>Port *<input name="port" value="{{ item.get('port', '3306') }}" required></label>
      <label>User *<input name="user" value="{{ item.get('user', '') }}" required></label>
      <label>OCI Vault Secret OCID *<input name="secret_ocid" value="{{ item.get('secret_ocid', '') }}" required></label>
      <label>Unix socket (optional)<input name="socket" value="{{ item.get('socket', '') }}"></label>
      {% elif kind == 'source-tables' %}
      <label>Name *<input name="name" value="{{ item.get('name', '') }}" required></label>
      <label>Source connection *<select name="connection" required>{% for c in source_connections %}<option value="{{ c.name }}" {{ 'selected' if item.get('connection') == c.name else '' }}>{{ c.name }}</option>{% endfor %}</select></label>
      <label>Schema.table or view *<input name="source" value="{{ item.get('source', '') }}" required></label>
      <label>Timestamp column *<input name="timestamp_column" value="{{ item.get('timestamp_column', 'event_time') }}" required></label>
      {% elif kind == 'archive-tables' %}
      <label>Name *<input name="name" value="{{ item.get('name', '') }}" required></label>
      <label>Archive connection *<select name="connection" required>{% for c in archive_connections %}<option value="{{ c.name }}" {{ 'selected' if item.get('connection') == c.name else '' }}>{{ c.name }}</option>{% endfor %}</select></label>
      <label>Archive database *<input name="archive_db" value="{{ item.get('archive_db', '') }}" required></label>
      <label>Archive table *<input name="archive_table" value="{{ item.get('archive_table', '') }}" required></label>
      {% else %}
      <label>Name *<input name="name" value="{{ item.get('name', '') }}" required></label>
      <label>Source table *<select name="source_table" required>{% for t in source_tables %}<option value="{{ t.name }}" {{ 'selected' if item.get('source_table') == t.name else '' }}>{{ t.name }}</option>{% endfor %}</select></label>
      <label>Archive table *<select name="archive_table_ref" required>{% for t in archive_tables %}<option value="{{ t.name }}" {{ 'selected' if item.get('archive_table_ref') == t.name else '' }}>{{ t.name }}</option>{% endfor %}</select></label>
      <label class="checkbox-field"><input type="checkbox" name="enabled" {{ 'checked' if item.get('enabled', 'true') != 'false' else '' }}><span>Enable this mapping</span></label>
      {% endif %}
    </fieldset>
    <div class="form-actions"><button type="submit">Save</button><button type="button" onclick="location.href='{{ url_for('configuration') }}'">Cancel</button></div>
  </form>
</section>
{% endblock %}
