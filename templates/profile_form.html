<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create profile</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login-body"><main class="login-shell"><h1>Create connection profile</h1><p>Profiles keep connection defaults only; passwords are never stored.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Profile name *<input name="profile_name" required></label><label>Connection type *<select name="mode"><option value="tcp">TCP</option><option value="socket">Unix socket</option></select></label><label>Host<input name="host" value="127.0.0.1"></label><label>Port<input name="port" type="number" min="1" max="65535" value="3306"></label><label>Unix socket path <small>Optional for TCP; required only when connection type is Unix socket.</small><input name="socket"></label><label class="checkbox-field"><input type="checkbox" name="profile_management"> Allow profile to manage job settings</label><label>Archive control schema (existing schema)<input name="control_schema" placeholder="archive_control"></label><label>Worker control user<input name="control_user"></label><label>Worker credential Secret OCID<input name="control_secret_ocid" placeholder="ocid1.vaultsecret.…"></label><button>Save profile</button></form><p class="login-footer"><a href="{{ url_for('login') }}">Back to sign in</a></p></main></body></html>
