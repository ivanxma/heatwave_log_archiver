<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Error Log Archiver login</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login-body"><main class="login-shell"><span class="brand-mark">EA</span><h1>Error Log Archiver</h1><p>Sign in with a MySQL connection profile to administer archival and retention.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="form-stack" autocomplete="off"><label>Connection profile *<select name="profile_name" required>{% for name, profile in profiles.items() %}<option value="{{ name }}" {{ 'selected' if selected_profile == name else '' }}>{{ name }}</option>{% endfor %}</select></label><label>MySQL username *<input name="username" required autofocus autocomplete="username"></label><label>MySQL password *<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form><p class="login-footer">Need another target? <a href="{{ url_for('create_profile') }}">Create a connection profile</a></p></main></body></html>
